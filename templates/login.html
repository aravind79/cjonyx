{% extends "base.html" %}
{% block title %}CJONYX - Login{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <div class="mx-auto h-12 w-auto flex justify-center">
                <img class="h-12 w-auto" src="{{ url_for('static', filename='images/Clogo.png') }}" alt="CJONYX">
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Sign in to your account
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Or
                <a href="{{ url_for('signup') }}" class="font-medium text-primary hover:text-primary/80">
                    create a new account
                </a>
            </p>
        </div>
        
        <form class="mt-8 space-y-6" method="POST">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="username" class="sr-only">Username</label>
                    <input id="username" name="username" type="text" required class="appearance-none rounded-none relative block w-full p-2 border px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm" placeholder="Username">
                </div>
                <br>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" required class="appearance-none rounded-none relative p-2 border block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm" placeholder="Password">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                        Remember me
                    </label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-primary hover:text-primary/80">
                        Forgot your password?
                    </a>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-lock h-5 w-5 text-primary/50 group-hover:text-primary/40" aria-hidden="true"></i>
                    </span>
                    Sign in
                </button>
            </div>
            
            <div class="text-center">
                <a href="{{ url_for('index') }}" class="font-medium text-gray-600 hover:text-primary">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Home
                </a>
            </div>
        </form>
    </div>
</section>

<!-- Modal for messages -->
<div id="messageModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="mt-3 text-center">
            <div id="modalIcon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4">
                <i id="modalIconClass" class="text-2xl"></i>
            </div>
            <h3 id="modalTitle" class="text-lg leading-6 font-medium text-gray-900 mb-2"></h3>
            <div class="mt-2 px-7 py-3">
                <p id="modalMessage" class="text-sm text-gray-500"></p>
            </div>
            <div class="items-center px-4 py-3">
                <button id="modalOkButton" class="px-4 py-2 bg-primary text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Modal functionality
    function showModal(type, title, message, callback = null) {
        const modal = document.getElementById('messageModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalIconClass = document.getElementById('modalIconClass');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalOkButton = document.getElementById('modalOkButton');
        
        // Set icon and colors based on type
        if (type === 'success') {
            modalIcon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-green-100';
            modalIconClass.className = 'text-2xl fas fa-check text-green-600';
        } else if (type === 'error') {
            modalIcon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-red-100';
            modalIconClass.className = 'text-2xl fas fa-times text-red-600';
        } else {
            modalIcon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-blue-100';
            modalIconClass.className = 'text-2xl fas fa-info text-blue-600';
        }
        
        modalTitle.textContent = title;
        modalMessage.textContent = message;
        
        // Show modal
        modal.classList.remove('hidden');
        
        // Handle OK button click
        modalOkButton.onclick = function() {
            modal.classList.add('hidden');
            if (callback) callback();
        };
        
        // Close modal when clicking outside
        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.classList.add('hidden');
                if (callback) callback();
            }
        };
    }
    
    // Check for flash messages on page load
    document.addEventListener('DOMContentLoaded', function() {
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    {% if category == 'success' %}
                        showModal('success', 'Success!', '{{ message }}');
                    {% elif category == 'error' %}
                        showModal('error', 'Login Failed', '{{ message }}');
                    {% else %}
                        showModal('info', 'Notice', '{{ message }}');
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endwith %}
    });
    
    // Close modal with Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('messageModal');
            if (!modal.classList.contains('hidden')) {
                modal.classList.add('hidden');
            }
        }
    });
</script>
{% endblock %}
